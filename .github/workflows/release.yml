name: Release

# Runs when a version tag such as v0.2.0 is pushed (see "Releasing" in the README): tests
# that exact commit, builds the plugin, and publishes a GitHub release with the plugin
# attached and the version's notes from CHANGELOG.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: CompeyDev/setup-rokit@v0.2.1
      - name: Install the Roblox tools in rokit.toml
        run: |
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          "$HOME/.rokit/bin/rokit" install --no-trust-check
      - run: npm ci
      - name: Check that the tag is the version in package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME but package.json says $version." >&2
            exit 1
          fi
      - run: npm run format:check
      - run: npm test
      - run: npm run test:luau
      - run: npm run build:plugin
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/release-notes.mjs "$version" > build/notes.md
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" build/Keywright.rbxm \
            --title "Keywright $version" --notes-file build/notes.md --verify-tag $prerelease
