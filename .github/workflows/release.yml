name: Release

# Runs when a version tag such as v0.2.0 is pushed (see "Releasing" in CONTRIBUTING.md): tests
# that exact commit, builds the plugin and the single-file adapter, and publishes a GitHub
# release with both attached, the licences of what the adapter bundles, and the version's
# notes from CHANGELOG.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # For npm's trusted publishing, which proves to npm that a package comes from this workflow.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: CompeyDev/setup-rokit@v0.2.1
      - name: Install the Roblox tools in rokit.toml
        run: |
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          "$HOME/.rokit/bin/rokit" install --no-trust-check
      - run: npm ci
      - name: Check that the tag is the version in package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME but package.json says $version." >&2
            exit 1
          fi
      - run: npm run format:check
      - run: npm test
      - run: npm run test:luau
      - run: npm run build:release
      - name: Check the single-file adapter
        run: test "$(node build/release/keywright.mjs version)" = "${GITHUB_REF_NAME#v}"
      - name: Publish the release
        # A rerun, after a later step failed, finds the release already made: its files are
        # replaced with this run's, and the run goes on to the steps after.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          files="build/release/keywright.mjs build/release/Keywright.rbxm build/release/THIRD_PARTY_LICENSES.txt"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
            exit 0
          fi
          node scripts/release-notes.mjs "$version" > build/notes.md
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $files \
            --title "$GITHUB_REF_NAME" --notes-file build/notes.md --verify-tag $prerelease
      - name: Publish the npm package
        # Last, so that the GitHub release is out whatever npm says. Off until trusted
        # publishing is set up for this repository on npmjs.com and the repository variable
        # NPM_PUBLISH is set to true. The trusted publisher may only stage a version, which
        # refuses a plain `npm publish`: `npm stage publish` puts the version in npm's
        # staging area, and a maintainer approves it on npmjs.com before it goes live. It
        # packs the folder it runs in, and needs npm 11.15 or later, newer than the npm that
        # comes with Node 22, so npm 11 is run through npx. npm takes a prerelease only with
        # a tag of its own: it goes out as next, so that latest stays on the last release.
        if: vars.NPM_PUBLISH == 'true'
        working-directory: build/release
        run: |
          tag="latest"
          case "${GITHUB_REF_NAME#v}" in *-*) tag="next" ;; esac
          npx -y npm@11 stage publish --provenance --access public --tag "$tag"
